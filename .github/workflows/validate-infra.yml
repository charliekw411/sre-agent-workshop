name: Validate Workshop Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "src/**"
      - "agent/**"
      - "scripts/**"
      - "azure.yaml"
      - "requirements.txt"
      - ".github/workflows/validate-infra.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "src/**"
      - "agent/**"
      - "scripts/**"
      - "azure.yaml"
      - "requirements.txt"
      - ".github/workflows/validate-infra.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bicep-build:
    name: Bicep Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template:
          - infra/main.bicep
          - infra/apps.bicep
          - infra/alerts.bicep
          - infra/azd/main.bicep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Bicep CLI
        run: az bicep install
      - name: Build ${{ matrix.template }}
        run: az bicep build --file ${{ matrix.template }} --stdout > /dev/null
      - name: Lint ${{ matrix.template }}
        run: az bicep lint --file ${{ matrix.template }}

  dotnet-build:
    name: Build Sample Application
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - src/OrdersApi/OrdersApi.csproj
          - src/CatalogApi/CatalogApi.csproj
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build ${{ matrix.project }}
        run: dotnet build ${{ matrix.project }} --configuration Release

  deployment-hooks:
    name: Deployment hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Validate manifests and hook regressions
        run: |
          python scripts/workshop.py validate
          python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Validate PowerShell entrypoint
        shell: pwsh
        run: ./scripts/invoke-workshop.ps1 validate
      - name: Validate Bash entrypoints
        if: runner.os == 'Linux'
        run: shellcheck scripts/prepare-azd-env.sh scripts/export-azd-env.sh scripts/postdeploy.sh scripts/inject-fault.sh
