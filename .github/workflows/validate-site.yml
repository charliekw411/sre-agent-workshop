name: Validate Workshop Site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "web/**"
      - "mkdocs.yml"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/validate-site.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "web/**"
      - "mkdocs.yml"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/validate-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  site-build:
    name: JavaScript tests and strict docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Test interactive controls
        run: npm test

      - name: Bundle interactive controls
        run: npm run build:web

      - name: Build documentation
        run: mkdocs build --strict --site-dir dist
