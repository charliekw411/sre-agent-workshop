# yaml-language-server: $schema=https://aka.ms/azure.yaml.json

name: sre-agent-workshop
metadata:
  template: sre-agent-workshop@0.2.0
requiredVersions:
  azd: ">=1.18.0"
infra:
  provider: bicep
  path: infra/azd
workflows:
  up:
    steps:
      - azd: provision
hooks:
  preup:
    windows:
      shell: pwsh
      run: ./scripts/prepare-azd-env.ps1
      interactive: true
      dir: .
    posix:
      shell: sh
      run: bash ./scripts/prepare-azd-env.sh
      interactive: true
      dir: .
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/invoke-workshop.ps1 preprovision
      interactive: true
      dir: .
    posix:
      shell: sh
      run: python3 ./scripts/workshop.py preprovision
      interactive: true
      dir: .
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
      interactive: true
      dir: .
    posix:
      shell: sh
      run: bash ./scripts/postprovision.sh
      interactive: true
      dir: .
