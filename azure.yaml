# yaml-language-server: $schema=https://aka.ms/azure.yaml.json

name: sre-agent-workshop
metadata:
  template: sre-agent-workshop@0.1.0
requiredVersions:
  azd: ">=1.18.0"
infra:
  provider: bicep
  path: infra/azd
services:
  catalog-api:
    project: ./src/CatalogApi
    language: dotnet
    host: containerapp
    resourceName: catalog-api
    docker:
      path: ./Dockerfile
      remoteBuild: true
      image: catalog-api
  orders-api:
    project: ./src/OrdersApi
    language: dotnet
    host: containerapp
    resourceName: orders-api
    uses:
      - catalog-api
    docker:
      path: ./Dockerfile
      remoteBuild: true
      image: orders-api
workflows:
  up:
    steps:
      - azd: provision
      - azd: package
      - azd: deploy --all
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/prepare-azd-env.ps1
      dir: .
    posix:
      shell: sh
      run: ./scripts/prepare-azd-env.sh
      dir: .
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/export-azd-env.ps1
      dir: .
    posix:
      shell: sh
      run: ./scripts/export-azd-env.sh
      dir: .
